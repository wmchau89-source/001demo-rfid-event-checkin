<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Console</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card wide">
      <h1>Operator Console</h1>

      <section>
        <h2>Attendees</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tag ID</th>
                <th>Name</th>
                <th>Tier</th>
                <th>Routing</th>
                <th>Checked in</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="attendee-rows"></tbody>
          </table>
        </div>
      </section>

      <section>
        <h2>Add walk-in</h2>
        <form id="walkin-form">
          <input name="name" placeholder="Name" required />
          <input name="tagId" placeholder="Tag ID" required />
          <input name="routing" placeholder="Routing" required />
          <button type="submit">Add walk-in</button>
        </form>
        <p id="walkin-message" class="message" role="status"></p>
      </section>

      <section>
        <h2>Manual / QR fallback</h2>
        <form id="manual-form">
          <input name="tagId" placeholder="Tag ID" required />
          <button type="submit">Check in</button>
        </form>
        <p id="manual-message" class="message" role="status"></p>
      </section>

      <section>
        <h2>Lucky draw</h2>
        <button id="draw-btn" type="button">Run Lucky Draw</button>
        <button id="draw-reset-btn" type="button">Reset draw</button>
        <p id="draw-message" class="message" role="status"></p>
      </section>

      <section class="placeholder">
        <h2>Module: Gamified Retention Pool — Coming Soon</h2>
        <!-- FUTURE ADD-ON MODULE: LUCKY DRAW SLOT MACHINE -->
      </section>
    </main>

    <script type="module">
      import {
        attendees,
        addWalkIn,
        checkIn,
        resetCheckIn,
        findAttendee,
        writeScanEvent,
        writeDrawEvent,
        clearDrawEvent,
        entrantsOf,
      } from "./shared.js";

      const TAG_DEDUP_MS = 3000;
      const lastScanAt = new Map();

      const rowsEl = document.getElementById("attendee-rows");
      const walkinForm = document.getElementById("walkin-form");
      const walkinMessage = document.getElementById("walkin-message");
      const manualForm = document.getElementById("manual-form");
      const manualMessage = document.getElementById("manual-message");
      const drawBtn = document.getElementById("draw-btn");
      const drawResetBtn = document.getElementById("draw-reset-btn");
      const drawMessage = document.getElementById("draw-message");

      function showMessage(el, text) {
        el.textContent = text;
      }

      function renderRow(attendee) {
        const tr = document.createElement("tr");
        const values = [
          attendee.tagId,
          attendee.name,
          attendee.tier,
          attendee.routing,
          attendee.checkedIn ? "Yes" : "No",
        ];
        for (const value of values) {
          const td = document.createElement("td");
          td.textContent = value;
          tr.append(td);
        }

        const actionTd = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";

        const simulateBtn = document.createElement("button");
        simulateBtn.type = "button";
        simulateBtn.textContent = "Simulate Tag Entry";
        simulateBtn.addEventListener("click", () => checkInByTag(attendee.tagId));

        const resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.textContent = "Reset check-in";
        resetBtn.addEventListener("click", () => {
          resetCheckIn(attendee.tagId);
          render();
        });

        actions.append(simulateBtn, resetBtn);
        actionTd.append(actions);
        tr.append(actionTd);
        return tr;
      }

      function render() {
        rowsEl.replaceChildren(...attendees.map(renderRow));
      }

      function checkInByTag(tagId) {
        if (!findAttendee(attendees, tagId)) return "unknown";

        const now = Date.now();
        const last = lastScanAt.get(tagId);
        if (last !== undefined && now - last < TAG_DEDUP_MS) return "duplicate";
        lastScanAt.set(tagId, now);

        checkIn(tagId);
        writeScanEvent(tagId);
        render();
        return "checked-in";
      }

      manualForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const tagId = String(new FormData(manualForm).get("tagId")).trim();
        if (!tagId) {
          showMessage(manualMessage, "Enter a Tag ID.");
          return;
        }

        const result = checkInByTag(tagId);
        if (result === "unknown") {
          showMessage(manualMessage, `No attendee has Tag ID ${tagId}.`);
        } else if (result === "duplicate") {
          showMessage(manualMessage, `Tag ${tagId} was just scanned. Ignored.`);
        } else {
          const { name } = findAttendee(attendees, tagId);
          manualForm.reset();
          showMessage(manualMessage, `Checked in ${name}.`);
        }
      });

      walkinForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(walkinForm);
        const name = String(data.get("name")).trim();
        const tagId = String(data.get("tagId")).trim();
        const routing = String(data.get("routing")).trim();

        if (!name || !tagId || !routing) {
          showMessage(walkinMessage, "Name, Tag ID and Routing are all required.");
          return;
        }
        if (!addWalkIn({ name, tagId, routing })) {
          showMessage(walkinMessage, `Tag ID ${tagId} is already registered.`);
          return;
        }

        walkinForm.reset();
        render();
        showMessage(walkinMessage, `Added ${name}.`);
      });

      drawResetBtn.addEventListener("click", () => {
        clearDrawEvent();
        showMessage(drawMessage, "Draw reset.");
      });

      drawBtn.addEventListener("click", () => {
        localStorage.removeItem("drawEvent");
        const entrants = entrantsOf(attendees);
        if (entrants.length === 0) {
          showMessage(drawMessage, "No entrants yet.");
          return;
        }

        const winner = entrants[Math.floor(Math.random() * entrants.length)];
        writeDrawEvent({ winnerName: winner.name, winnerTagId: winner.tagId });
        showMessage(drawMessage, `Winner drawn: ${winner.name}.`);
      });

      render();
    </script>
  </body>
</html>
